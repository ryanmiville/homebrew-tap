name: Update Tinycast Personal

on:
  schedule:
    - cron: "47 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tinycast-personal-cask
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'ryanmiville/homebrew-tap'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Verify release and update cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node Scripts/update-tinycast-personal.mjs
          ruby -c Casks/tinycast-personal.rb
          git diff --check
      - name: Publish cask
        run: |
          if git diff --quiet && test -z "$(git ls-files --others --exclude-standard Casks)"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/tinycast-personal.rb
          git commit -m "Update Tinycast Personal"
          git push
